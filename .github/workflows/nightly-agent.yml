name: Nightly Agent

on:
  workflow_dispatch:
    inputs:
      task_mode:
        description: 'Task difficulty to pick (easy/medium/hard)'
        required: false
        default: 'easy'
      task_category:
        description: 'Optional category filter (a11y, code-quality, docs, pr-review, infra)'
        required: false
        default: ''
  schedule:
    - cron: '0 2 * * *'  # 3am UK (BST, UTC+1) — drifts to 2am once GMT (UTC+0) starts in late Oct

concurrency:
  group: nightly-agent
  cancel-in-progress: true

jobs:
  nightly-agent:
    name: Nightly Agent
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Note: PRs opened with GITHUB_TOKEN do not trigger CI workflows automatically.
      # A maintainer must re-trigger CI (close/reopen or push an empty commit) before merging.
      # This is a known GitHub limitation — same model as pr-review.js fix loop.

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Install root dependencies
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Validate secrets
        run: |
          if [[ -z "$ANTHROPIC_API_KEY" ]]; then
            echo "::error::ANTHROPIC_API_KEY secret is not set"
            exit 1
          fi

          # Presence is not validity. A well-formed key can belong to an account
          # with no credit — that passes a shape check and then fails the first
          # real call eleven seconds later. Spend one token against the same
          # endpoint and model the agent uses so the failure surfaces here, named.
          #
          # The key reaches curl as a config file on stdin: never as an argument
          # (printf is a bash builtin, so it is not in any process's argv) and
          # never on disk.
          body_file="$(mktemp)"
          trap 'rm -f "$body_file"' EXIT
          set +e
          http_code=$(
            printf 'header = "x-api-key: %s"\n' "$ANTHROPIC_API_KEY" |
            curl --config - --silent --show-error \
                 --connect-timeout 10 --max-time 30 \
                 --write-out '%{http_code}' --output "$body_file" \
                 https://api.anthropic.com/v1/messages \
              -H 'anthropic-version: 2023-06-01' \
              -H 'content-type: application/json' \
              -d "{\"model\":\"${AGENT_MODEL}\",\"max_tokens\":1,\"messages\":[{\"role\":\"user\",\"content\":\"ping\"}]}"
          )
          curl_status=$?
          set -e

          if [[ $curl_status -ne 0 ]]; then
            echo "::error::Could not reach the Anthropic API (curl exit ${curl_status})."
            echo "This is a network, DNS, or timeout failure — not a credential or billing problem."
            exit 1
          fi

          if [[ "$http_code" == 2* ]]; then
            echo "ANTHROPIC_API_KEY is set and the account accepted a live call to ${AGENT_MODEL}."
            exit 0
          fi

          # A 429 or 529 means the request authenticated and the account can
          # transact — precisely what this step exists to establish. Both are
          # retried by the agent (TRANSIENT_STATUS_CODES), so blocking on them
          # would fail a run that would otherwise have succeeded.
          if [[ "$http_code" == "429" || "$http_code" == "529" ]]; then
            echo "::warning::Anthropic API returned HTTP ${http_code} (rate limited or overloaded)."
            echo "The key authenticated, so credentials and billing are fine. The agent retries these — continuing."
            exit 0
          fi

          # Fail closed from here: anything else is treated as bad. jq only makes
          # the wording tidier, so the credit match runs against the raw body and
          # a missing jq costs detail, never the verdict.
          error_type=$(jq -r '.error.type // empty' "$body_file" 2>/dev/null || true)
          error_message=$(jq -r '.error.message // empty' "$body_file" 2>/dev/null || true)

          if grep -qi 'credit balance' "$body_file"; then
            echo "::error::The Anthropic account cannot transact (HTTP ${http_code})."
            if [[ -n "$error_message" ]]; then echo "API said: ${error_message}"; fi
            echo "This is a BILLING problem, not a secrets-configuration problem. The key itself is valid."
            echo "Top up the account balance — reissuing or re-setting ANTHROPIC_API_KEY will not help."
          elif [[ "$http_code" == "401" ]]; then
            echo "::error::ANTHROPIC_API_KEY was rejected (HTTP 401${error_type:+, ${error_type}})."
            echo "The key is wrong, revoked, or belongs to a different account. Reissue it and update the repository secret."
          else
            echo "::error::Anthropic API pre-flight failed with HTTP ${http_code}."
            echo "Response body:"
            cat "$body_file"
            echo
          fi
          exit 1
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-haiku-4-5' }}

      - name: Run nightly agent
        run: npm run nightly-agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ACTIONS: 'true'
          TASK_MODE: ${{ inputs.task_mode || vars.TASK_MODE || 'easy' }}
          TASK_CATEGORY: ${{ inputs.task_category || vars.TASK_CATEGORY || '' }}
          AGENT_MODEL: ${{ vars.AGENT_MODEL || 'claude-haiku-4-5' }}
          GITHUB_RUN_ID: ${{ github.run_id }}
