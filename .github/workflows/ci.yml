name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    name: .NET Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run tests
        run: dotnet test ItemsApi.Tests/ItemsApi.Tests.csproj --verbosity normal
